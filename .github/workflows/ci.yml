name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
          cache-enable: 'bun'

      - name: Get Bun cache hash
        id: bun-cache-hash
        run: echo "hash=$(hashFiles('bun.lockb'))" >> $GITHUB_OUTPUT

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ steps.bun-cache-hash.outputs.hash }}-${{ hashFiles('**/*.json', '**/*.ts', '**/*.tsx', '**/*.js', '**/*.jsx') }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ steps.bun-cache-hash.outputs.hash }}-
            ${{ runner.os }}-turbo-

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run lint

      - run: bun run test
